services:
  - type: web
    name: comic-con-buddy-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_MODE
        value: mock
      - key: FRONTEND_ORIGINS
        sync: false
